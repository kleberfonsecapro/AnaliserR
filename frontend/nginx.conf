server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SEC-006: headers de segurança e teto de payload
    client_max_body_size 25m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;
    # O HSTS só vale sob TLS; com o proxy Caddy (profile tls) ele é honrado.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # SEC-006: compressão e cache dos assets com hash do build
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        add_header Cache-Control "immutable";
        expires 1y;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
