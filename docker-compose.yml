x-limites-padrao: &limites
  mem_limit: 512m
  cpus: 1.0

x-logs-padrao: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logs
    <<: *limites

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Só o que precisa ser montado aqui; o resto vem do env_file (OPS-008).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ROLE: api
    depends_on:
      db:
        condition: service_healthy
    # SEC-001: sem porta no host. O acesso externo é via proxy (frontend 8091
    # ou o proxy TLS abaixo); quem precisar debugar usa `docker compose exec`.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logs
    <<: *limites

  # OPS-001: polling do Telegram em processo próprio. A API (`backend`)
  # responde mesmo se o Telegram cair; o heartbeat sustenta o healthcheck.
  bot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "bot_worker.py"]
    restart: unless-stopped
    env_file: .env
    environment:
      ROLE: bot
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; st=os.stat('/tmp/bot-ok'); sys.exit(0 if time.time()-st.st_mtime < 60 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logs
    <<: *limites

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8091:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *logs
    <<: *limites

  # SEC-001: HTTPS do painel. Sobe sob demanda com
  # `DOMAIN=painel.exemplo.com docker compose --profile tls up -d proxy`.
  # O Caddy emite/renova o certificado via Let's Encrypt; requer o domínio
  # apontando para este host e portas 80/443 liberadas.
  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    profiles: ["tls"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      frontend:
        condition: service_healthy
    logging: *logs
    <<: *limites

volumes:
  pgdata:
  caddy_data:
  caddy_config:
