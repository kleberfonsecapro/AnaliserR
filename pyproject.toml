[tool.ruff]
target-version = "py311"
line-length = 108
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# Baseline da Onda 0: regras que o código legado viola hoje. Cada ticket
# correspondente (ex.: TP-05/BUG-002 para ASYNC240) deve remover o seu ignore.
ignore = [
    "E501",     # linhas longas do legado
    "B008",     # chamada de função em argumento padrão (legado)
    "B904",     # raise sem from dentro de except (legado)
    "E741",     # variável de nome ambíguo (legado)
    "F841",     # variável não usada (legado)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
